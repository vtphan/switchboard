# Switchboard V4 Integration Dependency Graph
# Machine-readable dependencies for automatic integration test generation

phases:
  phase-1:
    name: "Foundation - Data & Configuration"
    provides:
      - "DatabaseManager"
      - "Session" 
      - "Message"
      - "Configuration"
      - "ErrorTypes"
    contracts:
      DatabaseManager: "Unified interface for all database operations with batching and retry"
      Session: "Immutable session state with validation constraints"
      Message: "3-type message structure with role-based filtering support"
      Configuration: "System constants for connection, database, and rate limiting"
      ErrorTypes: "Standard Go error types for consistent error handling"
    validation:
      architectural:
        - "No circular dependencies between pkg/ and internal/"
        - "DatabaseManager interface completeness"
        - "SQLite WAL mode configuration applied"
      functional:
        - "Database batching works with 100 message limit"
        - "Session validation constraints enforced"
        - "Message type validation working"

  phase-2:
    name: "Session Management"
    depends_on: ["phase-1"]
    provides:
      - "SessionManager"
      - "SessionLifecycle"
    contracts:
      SessionManager: "Thread-safe session state with atomic operations using RWMutex"
      SessionLifecycle: "Start/end session with database persistence and error rollback"
    integration_points:
      - flow: "session_persistence"
        from: "SessionManager.SetActiveSession()"
        to: "DatabaseManager.CreateSession()"
        test: "session_database_integration"
      - flow: "session_state_consistency"
        from: "SessionManager atomic operations"
        to: "Session validation"
        test: "session_state_integration"
        status: "verified"
        validation_notes: "Step 2.3 validation functions fully implemented and tested"
    validation:
      architectural:
        - "No imports from websocket or message packages"
        - "RWMutex usage for read-heavy session access"
        - "Atomic session state changes"
      functional:
        - "Session start/end persistence works correctly"
        - "Session rollback on database failure"
        - "Concurrent session access thread-safe"

  phase-3:
    name: "Message Processing & Rate Limiting"
    depends_on: ["phase-1", "phase-2"]
    provides:
      - "MessageProcessor"
      - "MessageRouter"
      - "RoleBasedFilter"
      - "RateLimiter"
    contracts:
      MessageProcessor: "End-to-end message processing with session validation"
      MessageRouter: "3-type message routing (broadcast_to_instructors, direct_message, broadcast_to_students)"
      RoleBasedFilter: "Student privacy preservation with instructor oversight"
      RateLimiter: "100 messages/minute per user with cleanup"
    integration_points:
      - flow: "message_session_validation"
        from: "MessageProcessor.ProcessIncomingMessage()"
        to: "SessionManager.GetActiveSession()"
        test: "message_session_integration"
      - flow: "message_persistence"
        from: "MessageProcessor routing"
        to: "DatabaseManager.WriteMessage()"
        test: "message_database_integration"
      - flow: "role_based_filtering"
        from: "RoleBasedFilter.shouldReceiveMessage()"
        to: "Message type and user role"
        test: "message_filtering_integration"
    validation:
      architectural:
        - "Message processor uses SessionManager interface only"
        - "Rate limiter independent of message processing"
        - "Role-based filtering isolated and testable"
      functional:
        - "Messages rejected without active session"
        - "3-type routing works correctly for all roles"
        - "Rate limiting prevents spam (100/minute limit)"
        - "Student privacy preserved, instructors see all"

  phase-4:
    name: "WebSocket Infrastructure"
    depends_on: ["phase-1", "phase-2", "phase-3"]
    provides:
      - "Connection"
      - "ConnectionRegistry"
      - "ConnectionLifecycle"
      - "HeartbeatMonitoring"
    contracts:
      Connection: "Single-writer pattern with 100-message buffered channel"
      ConnectionRegistry: "Thread-safe connection management with cleanup"
      ConnectionLifecycle: "Connection creation, authentication, and cleanup"
      HeartbeatMonitoring: "30-second ping/pong with automatic cleanup"
    integration_points:
      - flow: "connection_authentication"
        from: "Connection.SetCredentials()"
        to: "User role validation"
        test: "connection_auth_integration"
      - flow: "message_delivery"
        from: "Connection.WriteJSON()"
        to: "MessageProcessor filtered output"
        test: "connection_message_integration"
      - flow: "session_state_delivery"
        from: "Connection establishment"
        to: "SessionManager.GetActiveSession()"
        test: "connection_session_integration"
      - flow: "connection_cleanup"
        from: "Connection.LastSeen timeout"
        to: "ConnectionRegistry.cleanupStaleConnections()"
        test: "connection_cleanup_integration"
    validation:
      architectural:
        - "Single-writer pattern enforced per connection"
        - "Buffered channels sized exactly 100 messages"
        - "No business logic in connection layer"
      functional:
        - "Connection authentication persists correctly"
        - "Message delivery maintains order"
        - "Heartbeat monitoring detects dead connections"
        - "Cleanup removes stale connections within 30 seconds"

  phase-5:
    name: "HTTP API & System Integration"
    depends_on: ["phase-1", "phase-2", "phase-3", "phase-4"]
    provides:
      - "SessionAPI"
      - "WebSocketUpgrade"
      - "GracefulShutdown"
      - "SystemIntegration"
    contracts:
      SessionAPI: "RESTful session start/end with instructor authentication"
      WebSocketUpgrade: "WebSocket connection upgrade with user authentication"
      GracefulShutdown: "Multi-phase shutdown with message processing completion"
      SystemIntegration: "Complete system with all components working together"
    integration_points:
      - flow: "session_api_management"
        from: "HTTP POST /api/session/start"
        to: "SessionManager.SetActiveSession()"
        test: "session_api_integration"
      - flow: "websocket_upgrade"
        from: "WebSocket upgrade request"
        to: "Connection.HandleClientConnection()"
        test: "websocket_upgrade_integration"
      - flow: "complete_message_flow"
        from: "WebSocket message received"
        to: "Database persistence and broadcast delivery"
        test: "end_to_end_message_integration"
      - flow: "graceful_shutdown"
        from: "SIGTERM signal"
        to: "All components clean shutdown"
        test: "graceful_shutdown_integration"
    validation:
      architectural:
        - "HTTP handlers use established interfaces only"
        - "WebSocket upgrade follows connection patterns"
        - "Graceful shutdown respects component dependencies"
      functional:
        - "Session API correctly manages session lifecycle"
        - "WebSocket connections integrate with session state"
        - "Complete message flow works end-to-end"
        - "Graceful shutdown completes within timeout"

integration_flows:
  session_database_flow:
    phases: ["phase-1", "phase-2"]
    steps:
      - "Create Session struct with validation"
      - "Call SessionManager.SetActiveSession()"
      - "Persist via DatabaseManager.CreateSession()"
      - "Verify session retrievable via GetActiveSession()"
    files:
      - "internal/database/models.go"
      - "internal/session/manager.go"
    test_file: "tests/integration/session_database_integration_test.go"

  message_processing_flow:
    phases: ["phase-1", "phase-2", "phase-3"]
    steps:
      - "Receive message via MessageProcessor"
      - "Validate active session via SessionManager"
      - "Route message by type via MessageRouter"
      - "Apply role-based filtering"
      - "Persist via DatabaseManager"
    files:
      - "internal/message/processor.go"
      - "internal/message/router.go"
      - "internal/message/filter.go"
    test_file: "tests/integration/message_processing_integration_test.go"

  websocket_connection_flow:
    phases: ["phase-1", "phase-2", "phase-3", "phase-4"]
    steps:
      - "Upgrade HTTP to WebSocket"
      - "Create Connection with authentication" 
      - "Register in ConnectionRegistry"
      - "Send session state via SessionManager"
      - "Process incoming messages via MessageProcessor"
      - "Deliver outgoing messages via role filtering"
    files:
      - "internal/websocket/handler.go"
      - "internal/websocket/connection.go"
    test_file: "tests/integration/websocket_connection_integration_test.go"

  end_to_end_flow:
    phases: ["phase-1", "phase-2", "phase-3", "phase-4", "phase-5"]
    steps:
      - "Start session via HTTP API"
      - "Connect users via WebSocket"
      - "Send message via WebSocket"
      - "Process and route message"
      - "Deliver to recipients with role filtering"
      - "Persist to database with batching"
      - "Verify message history on new connections"
    files:
      - "web/api/handlers.go"
      - "All internal packages"
    test_file: "tests/integration/end_to_end_integration_test.go"

validation_requirements:
  architectural:
    dependencies: "No circular imports, correct dependency direction"
    boundaries: "Clean component separation, interface compliance"
    integration: "Contracts between components well-defined"
    patterns: "Go concurrency patterns followed correctly"

  functional:  
    requirements: "All specified behaviors implemented"
    contracts: "Integration points work as specified"
    error_handling: "All error cases handled correctly"
    business_logic: "Domain rules implemented accurately"

  technical:
    coverage: "85%+ statements, 80%+ branches for critical code"
    race_detection: "go test -race passes on all tests"
    performance: "Message routing <100µs, 50+ concurrent users"
    code_quality: "golangci-lint clean, proper documentation"

coverage_targets:
  critical_code:
    statements: 85
    branches: 80
  integration_tests:
    statements: 70
    branches: 65
  overall_project:
    statements: 75
    branches: 70