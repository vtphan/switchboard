<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switchboard Student Client</title>
    <link rel="stylesheet" href="../shared-styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header student-header">
            <h1>📚 Student Client</h1>
            <p>Ask questions, receive announcements, and participate in class sessions</p>
        </div>

        <!-- Connection Status -->
        <div class="status" id="status">
            <div class="status-dot" id="statusDot"></div>
            <div>
                <div class="status-text" id="statusText">Disconnected</div>
                <div class="session-info" id="sessionInfo">No active session</div>
            </div>
        </div>

        <!-- Connection Controls -->
        <div class="controls">
            <h3>Connection</h3>
            <div class="input-group">
                <input type="text" id="studentId" placeholder="Your student ID" value="student_alice">
                <button id="connectBtn" class="primary">Connect</button>
                <button id="disconnectBtn" class="secondary" disabled>Disconnect</button>
            </div>
        </div>

        <!-- Ask Question -->
        <div class="controls">
            <h3>Ask a Question</h3>
            <div class="input-group">
                <textarea id="questionText" placeholder="Type your question here..." rows="3"></textarea>
            </div>
            <div class="input-group">
                <textarea id="codeSnippet" placeholder="Optional: paste code snippet here..." rows="4"></textarea>
                <button id="askBtn" class="success" disabled>Ask Question</button>
            </div>
        </div>

        <!-- Messages -->
        <div class="messages-section">
            <div class="messages-header">
                📢 Class Messages
            </div>
            <div class="messages" id="messages"></div>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <span class="stat-number" id="questionsCount">0</span>
                <div class="stat-label">Questions Asked</div>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="messagesCount">0</span>
                <div class="stat-label">Messages Received</div>
            </div>
        </div>
    </div>

    <!-- Load SDK and application -->
    <script src="../../switchboard-client.js"></script>
    <script src="student-app.js"></script>
</body>
</html>
