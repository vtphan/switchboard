<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switchboard Teacher App V2</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>Switchboard Teacher App V2</h1>
      <p class="subtitle">Session management and simplified messaging demo</p>
      
      <div class="status-section">
        <div class="status-item">
          <label>Connection:</label>
          <span id="connectionStatus" class="status disconnected">Disconnected</span>
        </div>
        <div class="status-item">
          <label>Session:</label>
          <span id="sessionStatus" class="status inactive">No session</span>
        </div>
      </div>
      
      <div class="controls">
        <button id="connectBtn" class="btn primary">Connect</button>
        <button id="disconnectBtn" class="btn secondary" disabled>Disconnect</button>
      </div>
      
      <div class="session-section">
        <h3>Session Management</h3>
        <div class="input-group">
          <input type="text" id="sessionNameInput" placeholder="Enter session name..." value="Math Class Demo">
          <div style="display: flex; gap: 0.5rem;">
            <button id="startSessionBtn" class="btn primary" disabled>Start Session</button>
            <button id="endSessionBtn" class="btn danger" disabled>End Session</button>
          </div>
        </div>
      </div>
      
      <div class="messaging-section">
        <h3>Send Announcement</h3>
        <div class="input-group">
          <textarea id="announcementInput" placeholder="Type your announcement here..." rows="3"></textarea>
          <div class="message-options">
            <label>
              <input type="checkbox" id="importantCheck"> Mark as important
            </label>
            <select id="announcementContextSelect">
              <option value="announcement">Announcement</option>
              <option value="instruction">Instruction</option>
              <option value="emergency">Emergency</option>
              <option value="general">General</option>
            </select>
            <input type="text" id="tagsInput" placeholder="Tags (comma-separated)">
          </div>
          <div>
            <button id="announceBtn" class="btn primary" disabled>Send Announcement</button>
          </div>
        </div>
      </div>
      
      <div class="questions-section">
        <h3>Student Questions</h3>
        <div id="questionsList" class="messages-list"></div>
      </div>
      
      <div class="demo-section">
        <h3>V2 Protocol Compliance Demo</h3>
        <p>This demo shows the fixed context field handling:</p>
        <div id="protocolDemo" class="protocol-demo">
          <p>Send a message to see the protocol structure...</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="teacher-app.js"></script>
</body>
</html>
